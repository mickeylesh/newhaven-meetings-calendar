name: Update Calendar

on:
  schedule:
    # 11:00 UTC = 06:00 EST (winter) / 07:00 EDT (summer) — close to 6am ET year-round
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate calendar.ics
        run: python generate_calendar.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          if git diff --staged --quiet; then
            echo "calendar.ics unchanged — nothing to commit"
          else
            git commit -m "chore: update calendar.ics [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
